else if(pk==='m'){h='<div style="text-align:center;font-size:20px;margin-bottom:6px">🎯 MISSÕES DO DIA</div>'+MS.map(m=>{const p=Math.min(S.pr[m.k]||0,m.n),d=p>=m.n;return '<div class="it"><div style="flex:1">'+m.t+' ('+p+'/'+m.n+')<div class="bar"><i style="width:'+p/m.n*100+'%"></i></div></div>'+(S.cl[m.k]?'<span>✔</span>':'<button data-m="'+m.k+'" class="'+(d?'g':'k')+'">🪙 '+m.r+'</button>')+'</div>'}).join('')}

$('sh').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
if(d.x!==undefined){panel(0);return}
if(d.t){tab=d.t;pnl();return}
if(d.mu!==undefined){S.mus=S.mus?0:1;aset();save();pnl();return}
if(d.m){const m=MS.find(x=>x.k===d.m);if((S.pr[m.k]||0)>=m.n){S.coins+=m.r;S.cl[m.k]=1;save();sfx('coin');tst('+'+m.r+' moedas!')}else tst('Missão ainda não concluída');pnl();return}
